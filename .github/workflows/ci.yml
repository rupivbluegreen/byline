name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests with coverage
        run: pytest --cov=byline --cov-report=xml

  test-base-install:
    name: Base install (no [llm] extra)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base package only
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Verify no top-level anthropic or openai import
        run: |
          python -c "import byline; import byline.cli; import byline.report; import byline.compare; import byline.metrics; import byline.fingerprints; import byline.disproportion; import byline.github_client; import byline.corpus; import byline.models; import byline.llm; import byline.llm_provider; import byline.config; print('All base modules import without anthropic or openai')"
          # If any module top-level-imports anthropic or openai, the next line would fail.
          python -c "import sys; assert 'anthropic' not in sys.modules, f'anthropic was imported transitively: {sys.modules.get(\"anthropic\")}'; assert 'openai' not in sys.modules, f'openai was imported transitively: {sys.modules.get(\"openai\")}'; print('OK: anthropic and openai stay lazy')"

      - name: Verify CLI help works without [llm]
        run: |
          byline --help
          byline --version
          byline scan --help
          byline audit --help
          byline baseline --help
          byline align --help
          byline questions --help
          byline chat --help

      - name: Run deterministic test files
        run: |
          # Only tests that don't require the [llm] extra.
          # test_llm_provider.py is intentionally excluded: it monkey-patches
          # import_module and loads both SDKs, which would break this job.
          pytest tests/test_metrics.py tests/test_fingerprints.py tests/test_disproportion.py tests/test_models.py tests/test_repo_fetcher.py tests/test_voice.py tests/test_boilerplate.py tests/test_self_baseline.py tests/test_corpus.py tests/test_github_client.py tests/test_history.py tests/test_alignment_deterministic.py -v --no-cov
